<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<title>NINJA — cover</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@500;700&family=El+Messiri:wght@600;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0c0f13;color:#f3efe7;font-family:'Manrope',system-ui,sans-serif;
       background-image:radial-gradient(circle at 88% 6%,rgba(255,77,61,.26),transparent 46%),
                        radial-gradient(circle at 4% 100%,rgba(255,77,61,.12),transparent 40%)}
  .wrap{height:100%;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{font-family:'Sora',system-ui,sans-serif;font-weight:700;letter-spacing:.06em;font-size:30px;display:flex;align-items:center;gap:12px}
  .brand i{width:14px;height:14px;border-radius:50%;background:#ff4d3d;display:inline-block}
  h1{font-family:'Sora',system-ui,sans-serif;font-weight:700;font-size:66px;line-height:1.08;max-width:20ch;
     font-feature-settings:"kern"}
  h1 em{font-style:normal;color:#ff4d3d}
  .kick{font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#ff4d3d;font-weight:700;margin-bottom:18px}
  .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.12);padding-top:26px}
  .pill{background:#ff4d3d;color:#fff;font-weight:700;font-size:22px;padding:14px 26px;border-radius:999px}
  .url{font-size:19px;color:#9aa3af}
  html[lang="ar"] h1,html[lang="ar"] .brand{font-family:'El Messiri',system-ui,sans-serif}
  html[lang="ar"] body,html[lang="ar"] .pill,html[lang="ar"] .url{font-family:'Almarai',system-ui,sans-serif}
  html[lang="ar"] .kick{letter-spacing:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i></i>NINJA</div>
  <div>
    <div class="kick" data-fr="Sites web pour commerces de quartier · Bruxelles" data-nl="Websites voor buurtzaken · Brussel" data-ar="مواقع لمحلات الحيّ · بروكسل">Sites web pour commerces de quartier · Bruxelles</div>
    <h1 data-fr="Votre commerce mérite d'être <em>trouvé</em>." data-nl="Uw zaak verdient het om <em>gevonden</em> te worden." data-ar="محلّك يستحقّ أن <em>يُوجَد</em>.">Votre commerce mérite d'être <em>trouvé</em>.</h1>
  </div>
  <div class="foot">
    <div class="pill" data-fr="Démo gratuite · 0 € de création · 20 €/mois" data-nl="Gratis demo · 0 € opstartkost · 20 €/maand" data-ar="نسخة تجريبية مجانية · 0 € للبناء · 20 €/شهر">Démo gratuite · 0 € de création · 20 €/mois</div>
    <div class="url">ninja-sites.github.io/ninja-service</div>
  </div>
</div>
<script>
(function(){
  var l=(new URLSearchParams(location.search).get('lang')||'fr');
  if(['fr','nl','ar'].indexOf(l)<0) l='fr';
  document.documentElement.lang=l;
  document.documentElement.dir=(l==='ar')?'rtl':'ltr';
  document.querySelectorAll('[data-fr]').forEach(function(el){
    var v=el.getAttribute('data-'+l); if(v!=null) el.innerHTML=v;
  });
})();
</script>
</body>
</html>
